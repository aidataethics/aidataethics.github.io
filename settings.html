<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Settings | AI &amp; Data Ethics Toolkit</title>
    <link rel="stylesheet" href="shared/tailwind.css?v=3.2.0" />
    <script>
        // Paint the theme before first render. Until the student chooses one,
        // follow the operating system's light/dark preference (and keep
        // following it if it changes); an explicit choice from the toggle wins.
        (function () {
            var root = document.documentElement;
            var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
            function saved() { try { return localStorage.getItem('ethicsToolkitTheme'); } catch (e) { return null; } }
            function apply(dark) {
                root.classList.toggle('dark', dark);
                root.classList.toggle('light', !dark);
            }
            var s = saved();
            apply(s ? s === 'dark' : !!(mq && mq.matches));
            if (mq && mq.addEventListener) {
                mq.addEventListener('change', function (e) {
                    if (!saved()) {
                        apply(e.matches);
                        document.dispatchEvent(new CustomEvent('toolkit:themechange', { detail: { dark: e.matches } }));
                    }
                });
            }
            window.__setToolkitTheme = function (dark) {
                apply(dark);
                try { localStorage.setItem('ethicsToolkitTheme', dark ? 'dark' : 'light'); } catch (e) { }
            };
        })();
    </script>
    <link rel="stylesheet" href="shared/toolkit.css?v=3.2.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f8f5ee'/%3E%3Cpath d='M6 24h20M9 24l7-15 7 15M12 18h8' fill='none' stroke='%232749b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200 font-display min-h-screen flex antialiased selection:bg-primary selection:text-white overflow-x-hidden">
    <a href="#main" class="skip-link">Skip to main content</a>

    <main id="main" tabindex="-1" class="flex-1 md:ml-64 p-4 md:p-8 overflow-y-auto h-screen flex flex-col [&>*]:shrink-0">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 md:gap-0">
            <div class="flex items-center w-full md:w-auto justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Settings</h1>
                    <p class="text-slate-500 dark:text-slate-400 mt-1">Customize your experience and manage preferences.
                    </p>
                </div>
                <!-- Mobile Menu Button -->
                <button id="openSidebar" type="button" aria-label="Open navigation" class="md:hidden p-2 text-slate-500 hover:text-primary transition-colors">
                    <span class="material-icons-outlined text-2xl" aria-hidden="true">menu</span>
                </button>
            </div>

        </header>

        <div class="space-y-6 max-w-2xl">
            <div
                class="bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 rounded-xl p-6 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-medium text-slate-900 dark:text-white">Appearance</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Toggle between light and dark themes.</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="themeToggle" class="sr-only peer" checked />
                    <div
                        class="w-11 h-6 bg-slate-300 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
                    </div>
                    <span class="ml-2 text-sm text-slate-500 dark:text-slate-400"><span
                            class="material-icons-outlined text-sm align-middle">dark_mode</span></span>
                </label>
            </div>

            <div
                class="bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 rounded-xl p-6 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-medium text-slate-900 dark:text-white">Data Management</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Reset all locally stored data and preferences.
                    </p>
                </div>
                <button onclick="resetData()"
                    class="px-4 py-2 bg-red-500/10 text-red-500 hover:bg-red-500/20 rounded-lg text-sm font-medium transition-colors border border-red-500/30">
                    Reset All Data
                </button>
            </div>
        </div>


        <section aria-labelledby="sessionHeading"
            class="bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700/60 rounded-xl p-6 mb-6">
            <h2 id="sessionHeading" class="sr-only">Session record</h2>
            <div id="sessionPanel"></div>
        </section>

    </main>

    <script>
        function resetData() {
            if (confirm('Reset all toolkit data and preferences stored in this browser? '
                + 'This erases your session record too, and cannot be undone.')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
    <script src="shared/session.js?v=3.2.0"></script>
    <script src="shared/toolkit.js?v=3.2.0"></script>
    <script>
        Toolkit.mountShell({ active: null });
        ToolkitSession.renderPanel();
        ToolkitSession.maybeOfferConsent();
    </script>
</body>

</html>
